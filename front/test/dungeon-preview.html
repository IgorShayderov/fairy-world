<html>
  <head>
    <title>Isolated dungeon preview</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      import { createApp, ref } from '/node_modules/vue/dist/vue.esm-bundler.js';
      import { createPinia } from 'pinia';
      import { Quasar } from 'quasar';
      import I18nextVue from 'i18next-vue';
      import { createRouter, createMemoryHistory } from 'vue-router';
      import 'quasar/dist/quasar.css';
      import '@quasar/extras/material-icons/material-icons.css';
      import '/test/dungeon-preview.css';
      import { initializeI18n, i18n } from '/src/locales/i18n';
      import { useCurrentUserStore } from '/src/modules/Auth/store/currentUser';
      import Dungeon from '/src/modules/Game/components/DungeonRunEncounter.vue';
      import Battle from '/src/modules/Game/components/BattleEncounter.vue';
      import Settings from '/src/pages/SettingsPage.vue';
      import Profile from '/src/pages/ProfilePage.vue';
      import Blacksmith from '/src/modules/Game/components/BlacksmithDialog.vue';
      import { gameAudio } from '/src/shared/audio/gameAudio';
      import { dungeonBattle } from '/src/modules/Game/dungeonBattle';
      import { api } from '/src/shared/api/index.ts';
      await initializeI18n();
      gameAudio.listen();
      const pinia = createPinia();
      const user = useCurrentUserStore(pinia);
      const item = (name, type) => ({
        id: 1,
        name,
        description: '',
        icon: '',
        rarity: 'COMMON',
        equipmentType: [type],
        attributes: [],
        properties: [],
        price: 1,
      });
      user.user = {
        id: 7,
        name: 'Preview Hero',
        level: 20,
        premium: { active: new URLSearchParams(location.search).has('premium'), expiresAt: '2099-01-01T00:00:00Z' },
        quickBattleAvailable: new URLSearchParams(location.search).has('premium'),
        potionSlots: new URLSearchParams(location.search).has('filledSlots')
          ? Array.from({ length: 8 }, (_, index) => ({
              id: 200 + index,
              slot: `potion-${index + 1}`,
              quantity: 1,
              isEquiped: false,
              item: item('Medium Health Potion', 'POTION'),
            }))
          : [],
        activeBuffs: new URLSearchParams(location.search).has('buffs')
          ? [{ type: 'DAMAGE', value: 15, expiresAt: '2099-01-01T00:00:00Z' }]
          : [],
        inventory: [
          { id: 9, item: item('Minor Health Potion', 'POTION'), quantity: 2, isEquiped: false, slot: null },
          { id: 10, item: item('Lesser Health Potion', 'POTION'), quantity: 1, isEquiped: false, slot: null },
          { id: 11, item: item('Lesser Attack Potion', 'POTION'), quantity: 1, isEquiped: false, slot: null },
        ],
        equippedItems: [{ id: 1, item: item('Crossbow', 'WEAPON'), quantity: 1, isEquiped: true, slot: 'left-hand' }],
      };
      let potionId = 100;
      api.put = async (url, body) => {
        const slot = 'potion-' + url.split('/').pop();
        const previous = user.user.potionSlots.find((p) => p.slot === slot);
        if (previous) {
          user.user.inventory.find((p) => p.item.name === previous.item.name).quantity++;
          user.user.potionSlots = user.user.potionSlots.filter((p) => p.slot !== slot);
        }
        if (body.inventoryItemId === null) return { data: { success: true }, meta: {} };
        const entry = user.user.inventory.find((p) => p.id === body.inventoryItemId);
        if (!entry) throw new Error('Missing potion');
        entry.quantity--;
        user.user.potionSlots.push({ ...entry, id: potionId++, quantity: 1, slot });
        return { data: { success: true }, meta: {} };
      };
      user.fetchCurrentUser = async () => {};
      const forgeOffer = {
        cost: 1000, gemCost: 10, gold: 2500, gems: new URLSearchParams(location.search).has('poorForge') ? 9 : 25,
        items: [{ id: 42, name: 'Iron Crossbow', level: 20, rarity: 'RARE', upgradeType: 'DAMAGE', upgradeValue: 12, equipped: true }],
      };
      api.get = async () => ({ data: structuredClone(forgeOffer), meta: {} });
      api.post = async (url, body) => {
        if (url.endsWith('/remove-bonus') && body.expectedCost === 1000 && body.expectedGemCost === 10) {
          forgeOffer.items = []; forgeOffer.gold -= 1000; forgeOffer.gems -= 10;
          return { data: { success: true }, meta: {} };
        }
        throw new Error('Unexpected preview action');
      };
      const fighter = {
        name: 'Preview Hero',
        health: 80,
        maxHealth: 200,
        damage: 1000,
        defense: 0,
        dodge: 0,
        blockChance: 0,
        criticalChance: 0,
        criticalDamage: 150,
        movement: 3,
        attackRange: new URLSearchParams(location.search).has('melee') ? 1 : 7,
      };
      const names = [
        'Flamebound Stalker',
        'Cinder Stone Brute',
        'Ember Wraith',
        new URLSearchParams(location.search).get('boss') ?? 'Warden of the First Flame',
      ];
      const initial = {
        id: 'preview',
        dungeon: 'EMBERDEEP',
        status: 'ACTIVE',
        startedAt: '',
        player: fighter,
        opponents: names.map((name, index) => ({
          id: String(index),
          monsterType: name,
          image: '/images/dungeons/ancient-warden.webp',
          isBoss: index === 3,
          status: index === 3 ? 'LOCKED' : 'AVAILABLE',
          monster: { ...fighter, name, health: 80, maxHealth: 80, level: 20, rewardGold: 10, rewardExperience: 10 },
        })),
        latestEvents: [],
        lastBattleResult: null,
        lastExperience: 0,
        totalExperience: 0,
        rewards: null,
        damageDealt: {},
        tactical: { turn: 1, revision: 0, opponentId: '0', playerPosition: 40, monsterPosition: 41, moved: false },
        skills: {
          mana: 90,
          maxMana: 100,
          abilities: [
            {
              id: 'mage-fireball',
              name: 'Fireball',
              description: 'Launch a blazing sphere at the enemy.',
              effect: 'fire',
              manaCost: 20,
              rank: 1,
              remainingCooldown: 0,
              unavailable: null,
            },
            {
              id: 'mage-frost',
              name: 'Frost Lance',
              description: 'Pierce the target with enchanted ice.',
              effect: 'ice',
              manaCost: 30,
              rank: 1,
              remainingCooldown: 0,
              unavailable: null,
            },
          ],
        },
      };
      const scout = new URLSearchParams(location.search).has('scout');
      if (scout) {
        initial.skills.abilities = [
          {
            id: 'scout-aim',
            name: 'Frost Arrow',
            description: 'Slows movement by 2 for 3 enemy turns.',
            effect: 'frost-arrow',
            manaCost: 16,
            rank: 1,
            remainingCooldown: 0,
            unavailable: null,
          },
          {
            id: 'scout-pierce',
            name: 'Piercing Shot',
            description: 'Weakens armor by 30% for 3 successful hits.',
            effect: 'pierce',
            manaCost: 32,
            rank: 1,
            remainingCooldown: 0,
            unavailable: null,
          },
          {
            id: 'scout-volley',
            name: 'Poisoned Arrow',
            description: '35% chance to petrify for one enemy turn.',
            effect: 'poison',
            manaCost: 52,
            rank: 1,
            remainingCooldown: 0,
            unavailable: null,
          },
        ];
      }
      if (new URLSearchParams(location.search).has('melee')) initial.tactical.monsterPosition = 42;
      const legacy = new URLSearchParams(location.search).has('legacy');
      const enemySpell = new URLSearchParams(location.search).has('enemySpell');
      const enemyBuff = new URLSearchParams(location.search).has('enemyBuff');
      if (enemySpell) {
        initial.opponents[0].monsterType = 'Frost Revenant';
        initial.opponents[0].monster.name = 'Frost Revenant';
        initial.opponents[0].monster.attackStyle = 'RANGED';
        initial.tactical.monsterPosition = 48;
      }
      if (legacy) {
        delete initial.tactical;
        delete initial.player.attackRange;
        delete initial.player.movement;
        initial.opponents[0].status = 'DEFEATED';
        initial.opponents[0].monster.health = 0;
      }
      if (new URLSearchParams(location.search).has('edgeStart')) {
        initial.tactical.playerPosition = 33;
        initial.tactical.monsterPosition = 42;
      }
      const state = ref(initial);
      const normal = ref(dungeonBattle(initial, 7));
      if (new URLSearchParams(location.search).has('statusBadges')) {
        normal.value.monster.statuses = {
          slow: { turns: 2, reduction: 2 },
          armorBreak: { hits: 3, percent: 30 },
          petrify: { turns: 1 },
        };
      }
      function drink(id) {
        const entry = user.user.potionSlots.find((p) => p.id === id);
        if (!entry || entry.quantity <= 0) throw new Error('No potion');
        entry.quantity--;
        const next = structuredClone(JSON.parse(JSON.stringify(state.value)));
        next.player.health = Math.min(next.player.maxHealth, next.player.health + 50);
        state.value = next;
        normal.value = dungeonBattle(next, 7);
      }
      function attack(id, skill, command) {
        const next = JSON.parse(JSON.stringify(state.value));
        next.tactical ??= {
          turn: 1,
          revision: 0,
          opponentId: id,
          playerPosition: 40,
          monsterPosition: 41,
          moved: false,
        };
        const opponent = next.opponents.find((o) => o.id === id);
        let events;
        if (command.action === 'SKILL') {
          events = [
            {
              actor: 'PLAYER',
              action: 'SKILL',
              skillId: skill,
              skillName: 'Fireball',
              effect: 'fire',
              damage: 20,
              critical: false,
              dodged: false,
            },
          ];
          if (scout) {
            const ability = initial.skills.abilities.find((entry) => entry.id === skill);
            events[0].effect = ability.effect;
            events[0].skillName = ability.name;
            if (skill === 'scout-aim') {
              opponent.monster.statuses = { slow: { turns: 2, reduction: 2 } };
              events[0].statusText = 'Slowed: -2 movement for 3 turns';
            } else if (skill === 'scout-pierce') {
              opponent.monster.statuses = { armorBreak: { hits: 3, percent: 30 } };
              events[0].statusText = 'Armor weakened: -30% for 3 hits';
            } else events[0].statusText = 'Petrified: loses next turn';
          }
          opponent.monster.health -= 20;
          next.skills.mana -= 20;
          next.tactical.turn++;
        } else if (command.action === 'MOVE') {
          events = [
            {
              actor: 'PLAYER',
              action: 'MOVE',
              fromCell: next.tactical.playerPosition,
              toCell: command.targetCell,
              damage: 0,
              critical: false,
              dodged: false,
            },
          ];
          next.tactical.playerPosition = command.targetCell;
          next.tactical.moved = true;
        } else if (command.action === 'DEFEND' && enemyBuff) {
          events = [
            { actor: 'PLAYER', action: 'DEFEND', damage: 0, critical: false, dodged: false },
            { actor: 'MONSTER', actorName: opponent.monster.name, action: 'SKILL',
              skillId: 'arcane-focus', skillName: 'Arcane Focus', effect: 'empower', damage: 0,
              critical: false, dodged: false, statusText: 'Spell damage +35% for the next 2 attacks' },
          ];
          opponent.monster.statuses = { empower: { hits: 2, percent: 35 } };
          next.tactical.turn++;
        } else if (command.action === 'DEFEND' && enemySpell) {
          events = [
            { actor: 'PLAYER', action: 'DEFEND', damage: 0, critical: false, dodged: false },
            {
              actor: 'MONSTER',
              actorName: 'Frost Revenant',
              action: 'ATTACK',
              skillId: 'frost-bolt',
              skillName: 'Frost Bolt',
              effect: 'ice',
              damage: 10,
              critical: false,
              dodged: false,
            },
          ];
          next.player.health -= 10;
          next.tactical.turn++;
        } else if (command.action === 'DEFEND') {
          events = [
            { actor: 'PLAYER', action: 'DEFEND', damage: 0, critical: false, dodged: false },
            {
              actor: 'MONSTER',
              action: 'MOVE',
              fromCell: next.tactical.monsterPosition,
              toCell: 41,
              damage: 0,
              critical: false,
              dodged: false,
            },
            { actor: 'MONSTER', action: 'ATTACK', damage: 10, critical: false, dodged: false },
          ];
          next.tactical.monsterPosition = 41;
          next.player.health -= 10;
          next.tactical.turn++;
        } else {
          events = [{ actor: 'PLAYER', action: 'ATTACK', damage: 80, critical: false, dodged: false }];
          opponent.monster.health = 0;
          opponent.status = 'DEFEATED';
          next.damageDealt['5'] = { name: 'Preview Hero', damage: (next.damageDealt['5']?.damage ?? 0) + 80 };
          next.tactical.turn++;
          next.tactical.moved = false;
        }
        next.exchange = {
          opponentId: id,
          events,
          playerPosition: next.tactical.playerPosition,
          monsterPosition: next.tactical.monsterPosition,
        };
        next.latestEvents.push(...events);
        next.tactical.revision++;
        if (opponent.monster.health === 0) {
          const upcoming = next.opponents.find((o) => o.monster.health > 0);
          if (upcoming) {
            next.tactical.opponentId = upcoming.id;
            next.tactical.monsterPosition = 34;
            upcoming.status = 'AVAILABLE';
          } else {
            next.status = 'VICTORY';
            next.rewards = { gold: 40, experience: 40, items: [], craftItems: [] };
          }
        }
        if (legacy) {
          delete next.tactical;
          delete next.exchange;
        }
        state.value = next;
      }
      createApp({
        components: { Dungeon, Battle, Settings, Profile, Blacksmith },
        setup: () => ({
          state,
          normal,
          drink,
          attack,
          standard: new URLSearchParams(location.search).has('standard'),
          settings: new URLSearchParams(location.search).has('settings'),
          profile: new URLSearchParams(location.search).has('profile'),
          blacksmith: new URLSearchParams(location.search).has('blacksmith'),
        }),
        template:
          '<header class="preview-header">Fairy World · visual test</header><aside class="preview-sidebar">Menu</aside><main class="preview-content" style="display:flex;flex-direction:column"><Blacksmith v-if="blacksmith"/><Profile v-else-if="profile"/><Settings v-else-if="settings"/><Battle v-else-if="standard" :battle="normal" player-name="Preview Hero" :loading="false" @use-potion="drink"/><Dungeon v-else :battle="state" player-name="Preview Hero" :loading="false" @attack="attack" @use-potion="drink"/></main>',
      })
        .use(pinia)
        .use(Quasar)
        .use(I18nextVue, { i18next: i18n })
        .use(
          createRouter({ history: createMemoryHistory(), routes: [{ path: '/', component: { template: '<div />' } }] })
        )
        .mount('#app');
    </script>
  </body>
</html>
