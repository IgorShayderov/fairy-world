<html>
  <head>
    <style>
      body {
        margin: 0;
        background: #102028;
        color: white;
        font-family: sans-serif;
      }
      #app {
        height: 100vh;
      }
      .board {
        position: relative;
        height: 80vh;
      }
      button {
        padding: 15px;
        margin: 8px;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      import { createApp, ref } from '/node_modules/vue/dist/vue.esm-bundler.js';
      import Battlefield from '/src/modules/Game/components/Battlefield3D.vue';
      const battle = {
        id: 1,
        monsterType: new URLSearchParams(location.search).get('enemy') || 'DEMON',
        status: 'ACTIVE',
        turn: 1,
        player: { health: 100, maxHealth: 100 },
        monster: { name: new URLSearchParams(location.search).get('enemy') || 'Demon', health: 100, maxHealth: 100 },
        events: [],
        arena: {
          columns: 9,
          rows: 5,
          playerPosition: 20,
          monsterPosition: 24,
          blockedCells: [7, 35],
          reachableCells: [19, 21, 22],
          canAttack: true,
          playerAttackRange: new URLSearchParams(location.search).has('noAmmo')
            ? 1
            : new URLSearchParams(location.search).get('weapon') === 'CROSSBOW'
              ? 7
              : new URLSearchParams(location.search).get('weapon') === 'BOW'
                ? 6
                : 1,
        },
      };
      createApp({
        components: { Battlefield },
        setup() {
          const state = ref(battle);
          const busy = ref(false);
          const visible = ref(true);
          return {
            mageStaff: new URLSearchParams(location.search).has('staff'),
            handMode: new URLSearchParams(location.search).get('weapon') || 'TWO_HANDED',
            state,
            busy,
            visible,
            effects: ['slash', 'shockwave', 'heal', 'arrow', 'pierce', 'volley', 'fire', 'ice', 'arcane'],
            skill(effect) {
              state.value = {
                ...state.value,
                events: [
                  {
                    actor: 'PLAYER',
                    action: 'SKILL',
                    effect,
                    skillName: effect,
                    damage: effect === 'heal' ? 0 : 10,
                    healing: effect === 'heal' ? 20 : undefined,
                  },
                ],
              };
            },
            move() {
              state.value = {
                ...state.value,
                arena: { ...state.value.arena, playerPosition: 23 },
                events: [{ actor: 'PLAYER', action: 'MOVE', fromCell: 20, toCell: 23 }],
              };
            },
            attack() {
              state.value = {
                ...state.value,
                events: [
                  { actor: 'PLAYER', action: 'ATTACK', damage: 10 },
                  { actor: 'MONSTER', action: 'ATTACK', damage: 10 },
                ],
              };
            },
            advance() {
              const fromCell = state.value.arena.playerPosition;
              state.value = {
                ...state.value,
                arena: { ...state.value.arena, playerPosition: 23 },
                events: [
                  { actor: 'PLAYER', action: 'MOVE', fromCell, toCell: 23 },
                  { actor: 'PLAYER', action: 'ATTACK', damage: 10 },
                  { actor: 'MONSTER', action: 'ATTACK', damage: 10 },
                ],
              };
            },
            dodge() {
              state.value = {
                ...state.value,
                events: [
                  { actor: 'PLAYER', action: 'ATTACK', dodged: true, damage: 0 },
                  { actor: 'MONSTER', action: 'ATTACK', dodged: true, damage: 0 },
                ],
              };
            },
            enemyMove() {
              const fromCell = state.value.arena.monsterPosition;
              state.value = {
                ...state.value,
                arena: { ...state.value.arena, monsterPosition: 22 },
                events: [{ actor: 'MONSTER', action: 'MOVE', fromCell, toCell: 22 }],
              };
            },
            enemyAttack() {
              state.value = {
                ...state.value,
                events: [{ actor: 'MONSTER', action: 'ATTACK', damage: 10 }],
              };
            },
            defend() {
              state.value = {
                ...state.value,
                events: [
                  { actor: 'PLAYER', action: 'DEFEND' },
                  { actor: 'MONSTER', action: 'ATTACK', blocked: true, damage: 0 },
                ],
              };
            },
            kill() {
              state.value = {
                ...state.value,
                status: 'VICTORY',
                events: [{ actor: 'PLAYER', action: 'ATTACK', damage: 100 }],
              };
            },
          };
        },
        template: `<div class="board"><Battlefield v-if="visible" :battle="state" :hand-mode="handMode" :mage-staff="mageStaff" :disabled="false" @busy="busy=$event"/></div><button @click="move" :disabled="busy">Walk</button><button @click="advance" :disabled="busy">Advance and strike</button><button @click="dodge" :disabled="busy">Dodge exchange</button><button @click="enemyMove" :disabled="busy">Enemy walk</button><button @click="enemyAttack" :disabled="busy">Enemy attack</button><button @click="defend" :disabled="busy">Defend</button><button @click="attack" :disabled="busy">Attack exchange</button><button @click="kill" :disabled="busy">Final blow</button><button v-for="effect in effects" @click="skill(effect)" :disabled="busy">Skill {{effect}}</button><button @click="visible=!visible">Toggle scene</button><span>{{busy?'Animating':'Ready'}}</span>`,
      }).mount('#app');
    </script>
  </body>
</html>
