name: project-check
on: push
jobs:
  checking:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: installation
        run: make install

      - name: lint-front
        run: make lint-front

      - name: lint-back
        run: make lint-back

      - name: test
        run: make test
