services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped

    env_file:
      - ./back/.env.production

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: ./back
      target: build

    env_file:
      - ./back/.env.production

    command: npx prisma migrate deploy

    depends_on:
      db:
        condition: service_healthy

    restart: "no"

  back:
    build:
      context: ./back
      target: production

    env_file:
      - ./back/.env.production

    restart: unless-stopped

    ports:
      - "127.0.0.1:3333:3333"

    depends_on:
      migrate:
        condition: service_completed_successfully

  front:
    build:
      context: ./front
      target: production-stage

    restart: unless-stopped

    ports:
      - "127.0.0.1:8080:80"

    depends_on:
      - back

volumes:
  postgres_data:
